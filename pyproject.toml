[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardarbot"
version = "1.0.0"
description = "Configurable Telegram bot that discovers undervalued used cars in Georgia and identifies resale opportunities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Davit Gegeshidze" }
]
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "apscheduler>=3.10.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[project.scripts]
cardarbot = "cardarbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cardarbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
